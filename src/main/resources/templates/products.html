<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Products')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="sidebar">
                <h6 class="fw-bold mb-3">Categories</h6>
                <ul class="list-unstyled">
                    <li class="mb-2"><a th:href="@{/products}" class="text-decoration-none">All Products</a></li>
                    <li class="mb-2" th:each="cat : ${categories}">
                        <a th:href="@{/products(categoryId=${cat.id})}" class="text-decoration-none" th:text="${cat.name}">Category</a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">
                    <span th:if="${search}">Search results for "<span th:text="${search}"></span>"</span>
                    <span th:unless="${search}">All Products</span>
                </h4>
                <span class="text-muted" th:text="${products.totalElements} + ' items'">0 items</span>
            </div>

            <div class="row g-4">
                <div class="col-6 col-md-4" th:each="product : ${products.content}">
                    <div class="product-card">
                        <a th:href="@{/products/{id}(id=${product.id})}">
                            <img th:if="${product.imageUrl}" th:src="@{${product.imageUrl}}" th:alt="${product.name}">
                            <img th:unless="${product.imageUrl}" src="https://placehold.co/400x300?text=No+Image" th:alt="${product.name}">
                        </a>
                        <div class="p-3">
                            <h6 class="mb-1" th:text="${product.name}">Product name</h6>
                            <p class="price-tag mb-2" th:text="'₹' + ${product.price}">₹0</p>
                            <p class="small text-muted mb-2" th:text="${product.inStock} ? 'In stock' : 'Out of stock'">In stock</p>
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-brand w-100">View Details</a>
                        </div>
                    </div>
                </div>
                <p th:if="${products.empty}" class="text-muted">No products found.</p>
            </div>

            <nav class="mt-4" th:if="${products.totalPages > 1}">
                <ul class="pagination">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link" th:href="@{/products(page=${i}, categoryId=${selectedCategoryId}, search=${search})}"
                           th:text="${i + 1}">1</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
