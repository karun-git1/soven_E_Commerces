<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Order Details')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Order #<span th:text="${order.id}">1001</span></h3>
        <span class="badge badge-status" th:classappend="'status-' + ${order.status}" th:text="${order.status}">Status</span>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="product-card p-4 mb-4">
                <h5 class="mb-3">Items</h5>
                <div class="d-flex justify-content-between mb-2" th:each="item : ${order.items}">
                    <span th:text="${item.product.name} + ' × ' + ${item.quantity}">Item</span>
                    <span th:text="'₹' + ${item.subtotal}">₹0</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold">
                    <span>Total</span>
                    <span th:text="'₹' + ${order.totalAmount}">₹0</span>
                </div>
            </div>

            <div class="product-card p-4">
                <h5 class="mb-3">Shipping Address</h5>
                <div th:if="${order.shippingAddress}">
                    <p class="mb-1" th:text="${order.shippingAddress.fullName}">Name</p>
                    <p class="mb-1" th:text="${order.shippingAddress.addressLine}">Address</p>
                    <p class="mb-1" th:text="${order.shippingAddress.city} + ', ' + ${order.shippingAddress.state} + ' - ' + ${order.shippingAddress.postalCode}">City</p>
                    <p class="mb-0" th:text="${order.shippingAddress.country}">Country</p>
                    <p class="text-muted mt-2" th:text="'Phone: ' + ${order.shippingAddress.phone}">Phone</p>
                </div>
                <p class="mb-0 text-muted" th:unless="${order.shippingAddress}">No shipping address provided.</p>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="sidebar mb-4">
                <h6 class="mb-2">Payment</h6>
                <p class="mb-1">Method: <strong th:text="${order.paymentMethod}">UPI</strong></p>
                <p class="mb-0" th:if="${order.payment}">
                    Status: <span class="badge badge-status" th:classappend="'status-' + ${order.payment.status}" th:text="${order.payment.status}">SUCCESS</span>
                </p>
            </div>
            <a th:href="@{/orders/{id}/track(id=${order.id})}" class="btn btn-brand w-100">Track Order</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
