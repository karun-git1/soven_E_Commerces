<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Order Placed')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5 text-center">
    <div class="product-card p-5 mx-auto" style="max-width: 500px;">
        <div style="font-size: 3rem;">✅</div>
        <h3 class="mt-3">Order Confirmed!</h3>
        <p class="text-muted">Your order #<span th:text="${order.id}">1001</span> has been placed successfully.</p>
        <p class="fw-bold price-tag" th:text="'₹' + ${order.totalAmount}">₹0</p>
        <div class="d-flex gap-2 justify-content-center mt-3">
            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-brand">View Order</a>
            <a th:href="@{/products}" class="btn btn-outline-brand">Continue Shopping</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
