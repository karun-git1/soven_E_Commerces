<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h3 class="mb-4">Checkout</h3>
    <form th:action="@{/checkout/place-order}" th:object="${addressRequest}" method="post">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="product-card p-4 mb-4">
                    <h5 class="mb-3">Shipping Address</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" th:field="*{addressLine}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">City</label>
                            <input type="text" th:field="*{city}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">State</label>
                            <input type="text" th:field="*{state}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Postal Code</label>
                            <input type="text" th:field="*{postalCode}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Country</label>
                            <input type="text" th:field="*{country}" value="India" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="product-card p-4">
                    <h5 class="mb-3">Payment Method</h5>
                    <div th:if="${razorpayEnabled}" class="alert alert-info">
                        Secure payment powered by Razorpay. UPI, cards, net banking and wallets are available in the gateway checkout.
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <div th:if="${!razorpayEnabled}" class="form-check border rounded p-3 payment-option" th:each="method : ${paymentMethods}">
                            <input class="form-check-input" type="radio" name="paymentMethod"
                                   th:id="${'pm-' + method}" th:value="${method}" required>
                            <label class="form-check-label" th:for="${'pm-' + method}" th:text="${method}">Method</label>
                        </div>
                    </div>
                    <input th:if="${razorpayEnabled}" type="hidden" name="paymentMethod" value="UPI">
                </div>
            </div>

            <div class="col-lg-5">
                <div class="sidebar">
                    <h5 class="mb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2" th:each="item : ${cart.items}">
                        <span th:text="${item.product.name} + ' × ' + ${item.quantity}">Item</span>
                        <span th:text="'₹' + ${item.subtotal}">₹0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="fw-bold">Total</span>
                        <span class="fw-bold price-tag" th:text="'₹' + ${total}">₹0</span>
                    </div>
                    <button type="submit" class="btn btn-brand w-100" th:text="${razorpayEnabled} ? 'Pay securely' : 'Place Order'">Place Order</button>
                </div>
            </div>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:if="${razorpayEnabled}" src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:src="@{/js/payment.js}"></script>
<script th:src="@{/js/checkout.js}"></script>
</body>
</html>
