<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Payment Successful')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5 text-center">
    <div class="product-card p-5 mx-auto" style="max-width: 500px;">
        <div style="font-size: 3rem;">💳✅</div>
        <h3 class="mt-3">Payment Successful</h3>
        <p class="text-muted">Payment for order #<span th:text="${order.id}">1001</span> was processed successfully.</p>
        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-brand mt-2">View Order</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
