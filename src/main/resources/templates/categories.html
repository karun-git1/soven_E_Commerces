<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Categories')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h3 class="mb-4">Shop by Category</h3>
    <div class="row g-4">
        <div class="col-6 col-md-3" th:each="cat : ${categories}">
            <a th:href="@{/products(categoryId=${cat.id})}" class="text-decoration-none">
                <div class="product-card text-center p-4">
                    <h5 class="mb-1" th:text="${cat.name}">Category</h5>
                    <p class="text-muted small" th:text="${cat.description}">Description</p>
                </div>
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
