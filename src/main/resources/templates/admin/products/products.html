<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Products')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="~{fragments/admin-navbar :: sidebar}"></div>
        </div>
        <div class="col-md-10 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Manage Products</h3>
                <a th:href="@{/admin/products/add}" class="btn btn-brand">+ Add Product</a>
            </div>

            <div class="alert alert-success" th:if="${param.added}">Product added successfully.</div>
            <div class="alert alert-success" th:if="${param.updated}">Product updated successfully.</div>
            <div class="alert alert-success" th:if="${param.deleted}">Product deleted successfully.</div>

            <div class="dashboard-card">
                <table class="table align-middle">
                    <thead>
                    <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Available</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products.content}">
                        <td>
                            <img th:if="${product.imageUrl}" th:src="@{${product.imageUrl}}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
                            <img th:unless="${product.imageUrl}" src="https://placehold.co/50x50" style="border-radius:8px;">
                        </td>
                        <td th:text="${product.name}">Name</td>
                        <td th:text="${product.category != null ? product.category.name : '-'}">Category</td>
                        <td th:text="'₹' + ${product.price}">₹0</td>
                        <td th:text="${product.stock}">0</td>
                        <td>
                            <form th:action="@{/admin/products/toggle-availability/{id}(id=${product.id})}" method="post">
                                <input type="hidden" name="available" th:value="${!product.available}">
                                <button type="submit" class="badge border-0" th:classappend="${product.available} ? 'status-DELIVERED' : 'status-CANCELLED'"
                                        th:text="${product.available} ? 'Available' : 'Unavailable'">Status</button>
                            </form>
                        </td>
                        <td class="d-flex gap-2">
                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-brand">Edit</a>
                            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post"
                                  onsubmit="return confirm('Delete this product?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
