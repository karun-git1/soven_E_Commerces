<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Categories')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="~{fragments/admin-navbar :: sidebar}"></div>
        </div>
        <div class="col-md-10 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Manage Categories</h3>
                <a th:href="@{/admin/categories/add}" class="btn btn-brand">+ Add Category</a>
            </div>

            <div class="alert alert-success" th:if="${param.added}">Category added successfully.</div>
            <div class="alert alert-success" th:if="${param.updated}">Category updated successfully.</div>
            <div class="alert alert-success" th:if="${param.deleted}">Category deleted successfully.</div>

            <div class="dashboard-card">
                <table class="table align-middle">
                    <thead><tr><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.name}">Name</td>
                        <td th:text="${cat.description}">Description</td>
                        <td class="d-flex gap-2">
                            <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-brand">Edit</a>
                            <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post"
                                  onsubmit="return confirm('Delete this category?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
