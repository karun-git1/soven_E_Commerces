<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Edit Category')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="~{fragments/admin-navbar :: sidebar}"></div>
        </div>
        <div class="col-md-10 py-4">
            <h3 class="mb-4">Edit Category</h3>
            <div class="dashboard-card" style="max-width: 480px;">
                <form th:action="@{/admin/categories/edit/{id}(id=${category.id})}" th:object="${categoryRequest}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" th:field="*{name}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-brand">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
