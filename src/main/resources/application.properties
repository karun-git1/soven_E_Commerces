spring.application.name=ecommerce-platform
server.port=${PORT:8081}

spring.profiles.active=dev

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/products

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Payment (Razorpay test mode; credentials stay in environment variables)
app.payment.provider=razorpay
app.payment.razorpay.key=${RAZORPAY_KEY_ID:}
app.payment.razorpay.secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.currency=INR
